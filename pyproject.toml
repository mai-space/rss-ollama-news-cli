[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rss-ollama-news-cli"
version = "0.1.0"
description = "A beautiful CLI newsletter with RSS feeds and local AI summarization via Ollama"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["rss", "cli", "ollama", "ai", "newsletter", "tui", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Terminals",
]
dependencies = [
    "textual>=0.60",
    "typer>=0.12",
    "rich>=13.7",
    "feedparser>=6.0",
    "httpx>=0.27",
    "ollama>=0.2",
    "aiosmtplib>=3.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
    "coverage[toml]>=7.4",
    "ruff>=0.4",
    "httpx>=0.27",
]

[project.scripts]
news = "newsroom.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/newsroom"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/tui/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "W"]
ignore = ["E501"]
